<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" font-family="Poppins, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1400" height="780" fill="#121109"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#B5A77B"/>
    </marker>
  </defs>

  <!-- Column labels -->
  <g fill="#9C9685" font-size="20" letter-spacing="2">
    <text x="80" y="110">SIGNALS</text>
    <text x="470" y="110">PIPELINE</text>
    <text x="800" y="110">MODELS</text>
    <text x="1150" y="110">OUTPUT</text>
  </g>

  <!-- Signals -->
  <g font-size="26" fill="#F4F1E8">
    <rect x="80" y="160" width="300" height="110" rx="6" fill="none" stroke="#423E30" stroke-width="2"/>
    <text x="110" y="208">Train doors</text>
    <text x="110" y="244" font-size="19" fill="#BDB7A6">door system data</text>

    <rect x="80" y="320" width="300" height="110" rx="6" fill="none" stroke="#423E30" stroke-width="2"/>
    <text x="110" y="368">Bogies</text>
    <text x="110" y="404" font-size="19" fill="#BDB7A6">bogie sensor data</text>

    <rect x="80" y="480" width="300" height="110" rx="6" fill="none" stroke="#423E30" stroke-width="2"/>
    <text x="110" y="528">Air-con and temp</text>
    <text x="110" y="564" font-size="19" fill="#BDB7A6">climate sensor data</text>
  </g>

  <!-- Arrows into pipeline -->
  <g stroke="#B5A77B" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <path d="M380 215 C 420 215, 430 330, 466 360"/>
    <path d="M380 375 L 466 375"/>
    <path d="M380 535 C 420 535, 430 420, 466 390"/>
  </g>

  <!-- Pipeline -->
  <rect x="470" y="280" width="260" height="190" rx="6" fill="#1B1A12" stroke="#B5A77B" stroke-width="2"/>
  <g fill="#F4F1E8" font-size="26">
    <text x="500" y="335">Clean the data</text>
    <text x="500" y="378" font-size="19" fill="#BDB7A6">check and prepare</text>
    <text x="500" y="404" font-size="19" fill="#BDB7A6">every signal before</text>
    <text x="500" y="430" font-size="19" fill="#BDB7A6">training</text>
  </g>

  <path d="M730 375 L 796 375" stroke="#B5A77B" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Models -->
  <rect x="800" y="200" width="300" height="350" rx="6" fill="none" stroke="#423E30" stroke-width="2"/>
  <g fill="#F4F1E8" font-size="24">
    <text x="830" y="250">Several custom-trained</text>
    <text x="830" y="282">models, compared</text>
    <rect x="830" y="320" width="210" height="44" rx="4" fill="none" stroke="#423E30" stroke-width="2"/>
    <rect x="830" y="378" width="210" height="44" rx="4" fill="none" stroke="#423E30" stroke-width="2"/>
    <rect x="830" y="436" width="210" height="44" rx="4" fill="#B5A77B" stroke="#B5A77B" stroke-width="2"/>
    <text x="848" y="349" font-size="18" fill="#9C9685">model A</text>
    <text x="848" y="407" font-size="18" fill="#9C9685">model B</text>
    <text x="848" y="465" font-size="18" fill="#0B0B0A">best per signal</text>
    <text x="830" y="522" font-size="18" fill="#BDB7A6">scored on the same test data</text>
  </g>

  <path d="M1100 375 L 1146 375" stroke="#B5A77B" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="1150" y="300" width="190" height="150" rx="6" fill="none" stroke="#B5A77B" stroke-width="2"/>
  <g fill="#F4F1E8" font-size="26">
    <text x="1178" y="355">Anomaly</text>
    <text x="1178" y="390">flags</text>
    <text x="1178" y="425" font-size="18" fill="#BDB7A6">in new data</text>
  </g>

  <!-- Track -->
  <g stroke="#2A271E" stroke-width="3">
    <line x1="80" y1="680" x2="1330" y2="680"/>
    <line x1="80" y1="700" x2="1330" y2="700"/>
  </g>
  <g stroke="#2A271E" stroke-width="6">
    <line x1="110" y1="672" x2="110" y2="708"/><line x1="190" y1="672" x2="190" y2="708"/><line x1="270" y1="672" x2="270" y2="708"/><line x1="350" y1="672" x2="350" y2="708"/><line x1="430" y1="672" x2="430" y2="708"/><line x1="510" y1="672" x2="510" y2="708"/><line x1="590" y1="672" x2="590" y2="708"/><line x1="670" y1="672" x2="670" y2="708"/><line x1="750" y1="672" x2="750" y2="708"/><line x1="830" y1="672" x2="830" y2="708"/><line x1="910" y1="672" x2="910" y2="708"/><line x1="990" y1="672" x2="990" y2="708"/><line x1="1070" y1="672" x2="1070" y2="708"/><line x1="1150" y1="672" x2="1150" y2="708"/><line x1="1230" y1="672" x2="1230" y2="708"/><line x1="1310" y1="672" x2="1310" y2="708"/>
  </g>
</svg>
